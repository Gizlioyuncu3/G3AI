<head>

    <style>
        :root {
            --bg-primary: #0f0f12;
            --bg-secondary: #1a1a1f;
            --bg-tertiary: #24242b;
            --bg-hover: #2d2d35;
            --bg-elevated: #1e1e24;
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --text-muted: #71717a;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --accent-light: rgba(99, 102, 241, 0.1);
            --border: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.15);
            --user-msg: linear-gradient(135deg, #ef4444, #6366f1);
            --ai-msg: #1e1e24;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.5);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
            --safe-left: env(safe-area-inset-left);
            --safe-right: env(safe-area-inset-right);
        }
        [data-theme="light"] {
            --bg-primary: #ffffff;
            --bg-secondary: #f8f9fa;
            --bg-tertiary: #f1f3f5;
            --bg-hover: #e9ecef;
            --bg-elevated: #ffffff;
            --text-primary: #1a1a1f;
            --text-secondary: #4a4a52;
            --text-muted: #71717a;
            --border: rgba(0, 0, 0, 0.08);
            --border-strong: rgba(0, 0, 0, 0.15);
            --user-msg: linear-gradient(135deg, #ef4444, #6366f1);
            --ai-msg: #f1f3f5;
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 10px 40px rgba(0, 0, 0, 0.12);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            display: flex;
            transition: background-color 0.3s, color 0.3s;
            -webkit-font-smoothing: antialiased;
            position: relative;
            padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
        }
        .bg-animation { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
        .bg-square {
            position: absolute;
            border: 1px solid var(--accent);
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.08), rgba(139, 92, 246, 0.04));
            border-radius: 4px;
            animation: fallDown linear infinite, blink ease-in-out infinite;
            opacity: 0;
        }
        @keyframes fallDown {
            0% { transform: translateY(-100px) rotate(0deg); }
            100% { transform: translateY(110vh) rotate(180deg); }
        }
        @keyframes blink { 0%, 100% { opacity: 0; } 50% { opacity: 0.6; } }
        button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
        input, textarea { font-family: inherit; border: none; outline: none; background: none; color: inherit; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
        .auth-overlay, #sidebar, #main-view, #overlay, .toast { position: relative; z-index: 1; }
        .auth-overlay { z-index: 1000; }
        #overlay { z-index: 90; }
        .auth-overlay {
            position: fixed; inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden;
            transition: var(--transition);
            padding: 20px;
        }
        .auth-overlay.active { opacity: 1; visibility: visible; }
        .auth-modal {
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: var(--shadow-lg);
            transform: scale(0.95) translateY(20px);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .auth-overlay.active .auth-modal { transform: scale(1) translateY(0); }
        .auth-logo { text-align: center; margin-bottom: 24px; }
        .auth-logo-icon {
            width: 60px; height: 60px;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            border-radius: var(--radius-md);
            display: inline-flex; align-items: center; justify-content: center;
            font-size: 28px; font-weight: 700; color: white; margin-bottom: 12px;
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
            overflow: hidden;
        }
        .auth-logo-icon img { width: 100%; height: 100%; object-fit: cover; }
        .auth-logo h2 { font-size: 1.5rem; font-weight: 700; }
        .auth-logo p { color: var(--text-secondary); font-size: 0.9rem; margin-top: 4px; }
        .auth-tabs {
            display: flex; gap: 4px;
            background: var(--bg-tertiary);
            padding: 4px; border-radius: var(--radius-md);
            margin-bottom: 24px;
        }
        .auth-tab {
            flex: 1; padding: 10px;
            border-radius: var(--radius-sm);
            font-size: 0.9rem; font-weight: 500;
            color: var(--text-secondary);
            transition: var(--transition);
        }
        .auth-tab.active {
            background: var(--bg-elevated);
            color: var(--text-primary);
            box-shadow: var(--shadow-sm);
        }
        .auth-form { display: flex; flex-direction: column; gap: 16px; }
        .auth-form.hidden { display: none; }
        .input-group { position: relative; }
        .input-group label {
            display: block; font-size: 0.85rem; font-weight: 500;
            margin-bottom: 6px; color: var(--text-secondary);
        }
        .input-group input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            transition: var(--transition);
        }
        .input-group input:focus { border-color: var(--accent); background: var(--bg-elevated); }
        .input-group i {
            position: absolute; left: 14px; top: 38px;
            color: var(--text-muted); font-size: 0.9rem;
        }
        .auth-btn {
            width: 100%; padding: 12px;
            background: linear-gradient(135deg, #ef4444, #6366f1);
            color: white;
            border-radius: var(--radius-sm);
            font-size: 0.95rem; font-weight: 600;
            transition: var(--transition);
            margin-top: 8px;
        }
        .auth-btn:hover { opacity: 0.9; }
        .auth-btn:active { transform: scale(0.98); }
        .auth-divider {
            display: flex; align-items: center; gap: 12px;
            color: var(--text-muted); font-size: 0.8rem; margin: 8px 0;
        }
        .auth-divider::before, .auth-divider::after {
            content: ''; flex: 1; height: 1px; background: var(--border);
        }
        .google-btn {
            width: 100%;
            padding: 11px 14px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: var(--transition);
        }
        .google-btn:hover { background: var(--bg-hover); border-color: var(--border-strong); }
        .google-btn svg { width: 18px; height: 18px; }
        #sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex; flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100; flex-shrink: 0;
        }
        .sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); }
        #new-chat-btn {
            width: 100%; padding: 12px;
            background: linear-gradient(135deg, #ef4444, #6366f1);
            color: white;
            border-radius: var(--radius-sm);
            font-size: 0.9rem; font-weight: 600;
            display: flex; align-items: center; justify-content: center;
            gap: 8px; transition: var(--transition);
        }
        #new-chat-btn:hover { opacity: 0.9; }
        #new-chat-btn:active { transform: scale(0.98); }
        .chat-list { flex: 1; overflow-y: auto; padding: 12px 8px; }
        .chat-group-label {
            padding: 8px 12px 4px;
            font-size: 0.7rem; font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .chat-item {
            padding: 10px 12px;
            margin-bottom: 2px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 0.88rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            transition: var(--transition);
            display: flex; align-items: center; gap: 8px;
        }
        .chat-item i { font-size: 0.8rem; flex-shrink: 0; }
        .chat-item span { overflow: hidden; text-overflow: ellipsis; flex: 1; }
        .chat-delete {
            opacity: 0; transition: opacity 0.2s;
            color: var(--text-muted);
            padding: 4px;
        }
        .chat-item:hover .chat-delete { opacity: 1; }
        .chat-delete:hover { color: var(--danger); }
        .chat-item:hover { background: var(--bg-hover); color: var(--text-primary); }
        .chat-item.active { background: var(--accent-light); color: var(--accent); }
        .sidebar-footer {
            padding: 0; border-top: 1px solid var(--border); position: relative;
        }
        .storage-usage {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 0.75rem;
            color: var(--text-secondary);
        }
        .storage-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            font-weight: 500;
        }
        .storage-bar {
            width: 100%;
            height: 6px;
            background: var(--bg-tertiary);
            border-radius: 3px;
            overflow: hidden;
            margin-bottom: 4px;
        }
        .storage-fill {
            height: 100%;
            background: linear-gradient(135deg, #ef4444, #6366f1);
            border-radius: 3px;
            transition: width 0.3s ease;
            width: 0%;
        }
        .storage-fill.warning { background: var(--warning); }
        .storage-fill.danger { background: var(--danger); }
        .storage-text {
            color: var(--text-muted);
            font-size: 0.7rem;
        }
        .user-profile {
            display: flex; align-items: center; gap: 10px;
            padding: 12px 16px;
            cursor: pointer; transition: var(--transition);
        }
        .user-profile:hover { background: var(--bg-hover); }
        .user-avatar {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ef4444, #6366f1);
            display: flex; align-items: center; justify-content: center;
            color: white; font-weight: 600; font-size: 0.9rem;
            flex-shrink: 0; overflow: hidden;
        }
        .user-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .user-info { flex: 1; overflow: hidden; }
        .user-name {
            font-size: 0.88rem; font-weight: 600;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .user-email {
            font-size: 0.75rem; color: var(--text-muted);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .user-dropdown {
            position: absolute;
            bottom: calc(100% + 8px);
            left: 12px; right: 12px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 6px;
            box-shadow: var(--shadow-lg);
            opacity: 0; visibility: hidden;
            transform: translateY(10px);
            transition: var(--transition);
            z-index: 50;
        }
        .user-dropdown.active { opacity: 1; visibility: visible; transform: translateY(0); }
        .dropdown-item {
            width: 100%; padding: 10px 12px;
            display: flex; align-items: center; gap: 10px;
            border-radius: var(--radius-sm);
            font-size: 0.88rem; color: var(--text-secondary);
            transition: var(--transition); text-align: left;
        }
        .dropdown-item:hover { background: var(--bg-hover); color: var(--text-primary); }
        .dropdown-item i { width: 16px; text-align: center; }
        .dropdown-divider { height: 1px; background: var(--border); margin: 4px 0; }
        .dropdown-item.danger { color: var(--danger); }
        .dropdown-item.danger:hover { background: rgba(239, 68, 68, 0.1); }
        #main-view { flex: 1; display: flex; flex-direction: column; position: relative; min-width: 0; }
        header {
            padding: 12px 20px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            gap: 12px; flex-shrink: 0;
        }
        .header-left { display: flex; align-items: center; gap: 12px; min-width: 0; }
        #menu-toggle {
            display: none; width: 40px; height: 40px;
            border-radius: var(--radius-sm); font-size: 1.1rem;
            color: var(--text-primary); transition: var(--transition); flex-shrink: 0;
        }
        #menu-toggle:hover { background: var(--bg-hover); }
        header h1 {
            font-size: 1.1rem; font-weight: 700; letter-spacing: 0.5px;
            display: flex; align-items: center; gap: 8px;
        }
        header h1 .badge {
            font-size: 0.65rem;
            background: linear-gradient(135deg, #ef4444, #6366f1); color: white;
            padding: 2px 6px; border-radius: 4px; font-weight: 600;
        }
        .header-actions { display: flex; align-items: center; gap: 8px; }
        .icon-btn {
            width: 40px; height: 40px;
            border-radius: var(--radius-sm);
            display: flex; align-items: center; justify-content: center;
            color: var(--text-secondary); font-size: 1rem;
            transition: var(--transition); flex-shrink: 0;
        }
        .icon-btn:hover { background: var(--bg-hover); color: var(--text-primary); }
        .header-profile-btn {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ef4444, #6366f1);
            display: none;
            align-items: center; justify-content: center;
            color: white; font-weight: 600; font-size: 0.85rem;
            cursor: pointer; transition: var(--transition);
            flex-shrink: 0; overflow: hidden;
            border: 2px solid transparent;
        }
        .header-profile-btn:hover { border-color: var(--accent); transform: scale(1.05); }
        .header-profile-btn img { width: 100%; height: 100%; object-fit: cover; }
        #chat-container {
            flex: 1; overflow-y: auto; padding: 24px;
            display: flex; flex-direction: column; gap: 20px;
            scroll-behavior: smooth;
        }
        .welcome-screen {
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            text-align: center; padding: 40px 20px; flex: 1; gap: 20px;
        }
        .welcome-icon {
            width: 80px; height: 80px;
            background: linear-gradient(135deg, #ef4444, #6366f1);
            border-radius: var(--radius-lg);
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; color: white;
            box-shadow: 0 12px 32px rgba(99, 102, 241, 0.3);
            animation: float 3s ease-in-out infinite;
            overflow: hidden;
        }
        .welcome-icon img { width: 100%; height: 100%; object-fit: cover; }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .welcome-screen h2 { font-size: 1.8rem; font-weight: 700; }
        .welcome-screen p { color: var(--text-secondary); max-width: 500px; line-height: 1.6; }
        .suggestion-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px; max-width: 700px; width: 100%; margin-top: 20px;
        }
        .suggestion-card {
            padding: 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            text-align: left; cursor: pointer;
            transition: var(--transition);
        }
        .suggestion-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }
        .suggestion-card i { color: var(--accent); margin-bottom: 8px; font-size: 1.1rem; }
        .suggestion-card h4 { font-size: 0.9rem; font-weight: 600; margin-bottom: 4px; }
